<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0d8e8"/>
      <stop offset="100%" stop-color="#4080a0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Garrafa -->
  <g transform="translate(150, 50)">
    <!-- Tampa -->
    <rect x="35" y="0" width="30" height="30" fill="#e52521" rx="3"/>
    <!-- Pescoço -->
    <rect x="40" y="30" width="20" height="40" fill="#7aaecc"/>
    <!-- Corpo -->
    <rect x="15" y="70" width="70" height="280" fill="url(#agua)" rx="8"/>
    <!-- Brilho -->
    <rect x="25" y="80" width="8" height="260" fill="#fff" opacity="0.3"/>
    <!-- Rótulo -->
    <rect x="15" y="160" width="70" height="100" fill="#fff" rx="2"/>
    <text x="50" y="200" text-anchor="middle" fill="#1a4080" font-size="14" font-weight="bold">ÁGUA</text>
    <text x="50" y="220" text-anchor="middle" fill="#1a4080" font-size="10">500ml</text>
    <circle cx="50" cy="240" r="10" fill="#1a4080"/>
  </g>
</svg>