<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a2810"/>
      <stop offset="100%" stop-color="#050f05"/>
    </radialGradient>
    <linearGradient id="lataGuarana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c8a3c"/>
      <stop offset="50%" stop-color="#0e5e28"/>
      <stop offset="100%" stop-color="#06381a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Lata -->
  <g transform="translate(130, 50)">
    <ellipse cx="70" cy="10" rx="70" ry="15" fill="#aaa"/>
    <ellipse cx="70" cy="10" rx="60" ry="10" fill="#888"/>
    <rect x="0" y="10" width="140" height="300" fill="url(#lataGuarana)"/>
    <!-- Faixa amarela -->
    <rect x="0" y="120" width="140" height="80" fill="#f1c232"/>
    <text x="70" y="160" text-anchor="middle" fill="#0e5e28" font-family="Arial" font-size="28" font-weight="bold" font-style="italic">Guaraná</text>
    <text x="70" y="185" text-anchor="middle" fill="#0e5e28" font-family="Arial" font-size="18" font-style="italic">Antarctica</text>
    <ellipse cx="70" cy="310" rx="70" ry="15" fill="#06381a"/>
    <rect x="15" y="20" width="8" height="280" fill="#fff" opacity="0.2"/>
  </g>
</svg>