<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a2410"/>
      <stop offset="100%" stop-color="#0f0d05"/>
    </radialGradient>
    <linearGradient id="batata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d570"/>
      <stop offset="100%" stop-color="#a87a1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Cone/copo vermelho -->
  <path d="M 100 60 L 300 60 L 280 360 L 120 360 Z" fill="#e52521"/>
  <ellipse cx="200" cy="60" rx="100" ry="15" fill="#ff3b36"/>
  <!-- Batatas -->
  <g transform="translate(200, 130)">
    <rect x="-80" y="0" width="14" height="200" fill="url(#batata)" rx="3" transform="rotate(-15)"/>
    <rect x="-50" y="20" width="14" height="180" fill="url(#batata)" rx="3" transform="rotate(-5)"/>
    <rect x="-20" y="0" width="14" height="200" fill="url(#batata)" rx="3" transform="rotate(8)"/>
    <rect x="10" y="15" width="14" height="185" fill="url(#batata)" rx="3" transform="rotate(-3)"/>
    <rect x="40" y="0" width="14" height="200" fill="url(#batata)" rx="3" transform="rotate(12)"/>
    <rect x="65" y="20" width="14" height="180" fill="url(#batata)" rx="3" transform="rotate(5)"/>
  </g>
</svg>