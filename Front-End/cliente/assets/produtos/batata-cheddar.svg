<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a2410"/>
      <stop offset="100%" stop-color="#0f0d05"/>
    </radialGradient>
    <linearGradient id="batata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d570"/>
      <stop offset="100%" stop-color="#a87a1c"/>
    </linearGradient>
    <linearGradient id="cheddar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#cc7a00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Recipiente -->
  <rect x="60" y="60" width="280" height="320" fill="#7a1a1a" rx="20"/>
  <rect x="60" y="60" width="280" height="40" fill="#5e0e0e" rx="20"/>
  <!-- Cheddar no topo (derretido) -->
  <path d="M 80 100 Q 130 95 180 105 Q 230 100 280 110 Q 320 105 320 115 L 320 140 Q 200 150 80 140 Z" fill="url(#cheddar)"/>
  <!-- Bacon -->
  <rect x="80" y="135" width="240" height="6" fill="#a83232"/>
  <rect x="80" y="148" width="240" height="6" fill="#a83232"/>
  <rect x="80" y="161" width="240" height="6" fill="#a83232"/>
  <!-- Batatas -->
  <g transform="translate(200, 220)">
    <rect x="-110" y="-20" width="14" height="120" fill="url(#batata)" rx="3" transform="rotate(-20)"/>
    <rect x="-80" y="-10" width="14" height="110" fill="url(#batata)" rx="3" transform="rotate(-8)"/>
    <rect x="-50" y="-25" width="14" height="125" fill="url(#batata)" rx="3" transform="rotate(10)"/>
    <rect x="-20" y="-15" width="14" height="115" fill="url(#batata)" rx="3" transform="rotate(-3)"/>
    <rect x="10" y="-22" width="14" height="120" fill="url(#batata)" rx="3" transform="rotate(15)"/>
    <rect x="40" y="-10" width="14" height="110" fill="url(#batata)" rx="3" transform="rotate(5)"/>
    <rect x="70" y="-25" width="14" height="125" fill="url(#batata)" rx="3" transform="rotate(-12)"/>
  </g>
  <!-- Mais cheddar derretido por cima -->
  <path d="M 70 200 Q 200 195 330 200 L 330 220 Q 200 230 70 220 Z" fill="url(#cheddar)" opacity="0.85"/>
</svg>