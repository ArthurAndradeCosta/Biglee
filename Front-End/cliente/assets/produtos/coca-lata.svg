<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a1010"/>
      <stop offset="100%" stop-color="#0f0505"/>
    </radialGradient>
    <linearGradient id="lataCoca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e52521"/>
      <stop offset="50%" stop-color="#c11a1a"/>
      <stop offset="100%" stop-color="#7a0e0e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Lata -->
  <g transform="translate(130, 50)">
    <!-- Topo -->
    <ellipse cx="70" cy="10" rx="70" ry="15" fill="#aaa"/>
    <ellipse cx="70" cy="10" rx="60" ry="10" fill="#888"/>
    <!-- Corpo -->
    <rect x="0" y="10" width="140" height="300" fill="url(#lataCoca)"/>
    <!-- Faixa branca -->
    <rect x="0" y="120" width="140" height="80" fill="#fff"/>
    <text x="70" y="160" text-anchor="middle" fill="#e52521" font-family="Arial" font-size="32" font-weight="bold" font-style="italic">Coca</text>
    <text x="70" y="185" text-anchor="middle" fill="#e52521" font-family="Arial" font-size="18" font-style="italic">Cola</text>
    <!-- Base -->
    <ellipse cx="70" cy="310" rx="70" ry="15" fill="#5a0a0a"/>
    <!-- Brilho lateral -->
    <rect x="15" y="20" width="8" height="280" fill="#fff" opacity="0.2"/>
  </g>
</svg>