<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a1f1f"/>
      <stop offset="100%" stop-color="#0f0a0a"/>
    </radialGradient>
    <linearGradient id="paoTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a87a4a"/>
    </linearGradient>
    <linearGradient id="carne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3410"/>
      <stop offset="100%" stop-color="#3d1f08"/>
    </linearGradient>
    <linearGradient id="queijo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1c232"/>
      <stop offset="100%" stop-color="#c79a1c"/>
    </linearGradient>
    <linearGradient id="batata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d570"/>
      <stop offset="100%" stop-color="#c79a1c"/>
    </linearGradient>
    <linearGradient id="lata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc1f1f"/>
      <stop offset="100%" stop-color="#7a0e0e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Lata de Coca à esquerda -->
  <g transform="translate(40, 200)">
    <ellipse cx="20" cy="0" rx="22" ry="6" fill="#999"/>
    <rect x="-2" y="0" width="44" height="100" fill="url(#lata)"/>
    <ellipse cx="20" cy="100" rx="22" ry="6" fill="#660"/>
    <text x="20" y="55" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">COCA</text>
  </g>
  <!-- Hamburguer central -->
  <ellipse cx="200" cy="100" rx="80" ry="25" fill="url(#paoTop)"/>
  <path d="M 130 130 L 270 130 L 275 145 L 125 145 Z" fill="url(#queijo)"/>
  <ellipse cx="200" cy="160" rx="80" ry="20" fill="url(#carne)"/>
  <ellipse cx="200" cy="200" rx="80" ry="25" fill="url(#paoTop)"/>
  <!-- Batata frita à direita -->
  <g transform="translate(320, 200)">
    <rect x="0" y="0" width="50" height="100" fill="#e52521" rx="5"/>
    <rect x="5" y="10" width="6" height="80" fill="url(#batata)"/>
    <rect x="15" y="15" width="6" height="75" fill="url(#batata)"/>
    <rect x="25" y="10" width="6" height="80" fill="url(#batata)"/>
    <rect x="35" y="15" width="6" height="75" fill="url(#batata)"/>
  </g>
</svg>