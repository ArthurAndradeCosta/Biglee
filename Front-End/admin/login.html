<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e63946">
    <title>Admin Login - Biglee Burguer</title>
    <link rel="icon" type="image/svg+xml" href="../cliente/assets/logo-removebg-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #e63946 0%, #c1272d 100%); }
        .login-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px 32px; width: 100%; max-width: 420px; }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo span { font-size: 56px; }
        .login-logo span img {
            width: 100px;
        }
        .login-logo h1 { font-size: 22px; font-weight: 800; margin-top: 8px; color: var(--cor-texto); }
        .login-logo p { color: var(--cor-texto-suave); font-size: 14px; }
        .login-alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 500; display: none; }
        .login-alert.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
        .login-alert.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
        .login-form button[type="submit"] { width: 100%; padding: 14px; background: var(--cor-primaria); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background .15s; }
        .login-form button[type="submit"]:hover { background: var(--cor-primaria-escura); }
        .login-form button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <span><img src="../cliente/assets/logo-removebg-preview.png" alt=""></span>
            <h1>Biglee Burguer</h1>
            <p>Painel administrativo</p>
        </div>

        <div id="alert" class="login-alert"></div>

        <form id="loginForm" class="login-form">
            <div class="adm-form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="admin@bigleeburger.com" autocomplete="email">
            </div>
            <div class="adm-form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" id="btnSubmit">Entrar</button>
        </form>

        <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--cor-texto-suave);">
            Voltar para o <a href="/cliente/" style="color:var(--cor-primaria); font-weight:600;">cardápio</a>
        </p>
    </div>

    <script>
        const API_URL = "/api";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alert");
            const btn = document.getElementById("btnSubmit");
            alertDiv.className = "login-alert";
            alertDiv.textContent = "";

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            btn.disabled = true;
            btn.textContent = "Entrando...";

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.mensagem || "Erro ao fazer login");

                localStorage.setItem("token", data.token);
                localStorage.setItem("usuario", JSON.stringify(data.usuario));

                alertDiv.className = "login-alert success";
                alertDiv.textContent = "Login realizado! Redirecionando...";

                setTimeout(() => window.location.href = "dashboard.html", 600);
            } catch (error) {
                alertDiv.className = "login-alert error";
                alertDiv.textContent = error.message;
                btn.disabled = false;
                btn.textContent = "Entrar";
            }
        });
    </script>
</body>
</html>
